name = "adplatform-worker"
main = "src/index.ts"
compatibility_date = "2025-03-01"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true
head_sampling_rate = 1

[[d1_databases]]
binding = "DB"
database_name = "adplatform-db"
database_id = "e7887010-4a18-472b-8167-fc60e53fea5e"   # replace after: wrangler d1 create adplatform-db

# Service binding to itself — required so the worker can hand off to the next
# recipient chunk (see /internal/campaigns/:id/continue in src/index.ts and
# the self-chain logic in src/sender.ts) WITHOUT a raw fetch() back to its
# own public URL. A plain fetch() to your own hostname is blocked by
# Cloudflare with error 1042 ("request appears to be part of an infinite
# loop"), even for a single hop. A service binding calls the same script
# directly through the Workers runtime instead, so it isn't treated as a
# public request and never trips that protection. "service" must match the
# `name` field at the top of this file.
[[services]]
binding = "SELF"
service = "adplatform-worker"

[vars]
SUPABASE_URL = "https://hwljdlgoysqaujzcnpeu.supabase.co"
FRONTEND_URL = "https://advertise.stellarglobalsupplies.com"

# ── Secrets Store ──────────────────────────────────────────────────────────────
# 1. Create your store (once):
#      wrangler secrets-store store create adplatform-secrets
#
# 2. Add each secret (replace YOUR_STORE_ID after step 1):
#      wrangler secrets-store secret create SUPABASE_SERVICE_KEY --store-id YOUR_STORE_ID --value "..."
#      wrangler secrets-store secret create SUPABASE_ANON_KEY    --store-id YOUR_STORE_ID --value "..."
#      wrangler secrets-store secret create NEON_DATABASE_URL    --store-id YOUR_STORE_ID --value "..."
#      wrangler secrets-store secret create TRACK_PIXEL_BASE_URL --store-id YOUR_STORE_ID --value "..."
#
# 3. Each secret_access block below binds one secret into the worker.
#    Replace store_id on every block with your actual store ID.
# ───────────────────────────────────────────────────────────────────────────────

[[secrets_store_secrets]]
binding = "SUPABASE_SERVICE_KEY"
store_id = "2556bcd9458349f6b4ff2a3fc93bdba1"
secret_name = "SUPABASE_SERVICE_KEY"

[[secrets_store_secrets]]
binding = "SUPABASE_ANON_KEY"
store_id = "2556bcd9458349f6b4ff2a3fc93bdba1"
secret_name = "SUPABASE_ANON_KEY"

[[secrets_store_secrets]]
binding = "NEON_DATABASE_URL"
store_id = "2556bcd9458349f6b4ff2a3fc93bdba1"
secret_name = "ADMIN_NEON_DB_URL"

[[secrets_store_secrets]]
binding = "TRACK_PIXEL_BASE_URL"
store_id = "2556bcd9458349f6b4ff2a3fc93bdba1"
secret_name = "TRACK_PIXEL_BASE_URL"

# Shared secret for the self-chained "continue sending" call the worker
# makes to itself (see worker/src/sender.ts + /internal/campaigns/:id/continue
# in worker/src/index.ts). This replaces the old cron-based resume — no
# scheduler needed. Generate any random string, e.g.:
#   openssl rand -hex 32
# then:
#   wrangler secrets-store secret create INTERNAL_CHAIN_SECRET --store-id 2556bcd9458349f6b4ff2a3fc93bdba1 --value "PASTE_RANDOM_STRING_HERE"
[[secrets_store_secrets]]
binding = "INTERNAL_CHAIN_SECRET"
store_id = "2556bcd9458349f6b4ff2a3fc93bdba1"
secret_name = "JWT_SECRET"
